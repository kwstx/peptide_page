<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>peptime Landing Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="top-banner">
        >99% purity peptides
        <a href="#" class="banner-btn">Shop all <span>›</span></a>
    </div>

    <header class="header">
        <div class="logo">peptime</div>
        <div class="header-icons">
            <div class="visa-badge">VISA</div>
            <button aria-label="Search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <button aria-label="User">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </button>
            <button aria-label="Cart">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            </button>
        </div>
    </header>

    <main class="main-content">
        <h1 class="hero-title">The American peptide vendor</h1>
        
        <div class="top-cards">
            <a href="#" class="top-card">
                <span class="card-title">All peptides</span>
                <div class="card-image"><img src="blue_vial.png" alt="Vial" class="vial-img"></div>
                <span class="arrow">›</span>
            </a>
            <a href="#" class="top-card">
                <span class="card-title">Get a hand</span>
                <div class="card-image"><img src="woman.png" alt="Woman" class="woman-img"></div>
                <span class="arrow">›</span>
            </a>
            <a href="#" class="top-card">
                <span class="card-title">Best sellers</span>
                <div class="card-image">
                    <div class="badge"><div class="dot"></div>A Grade</div>
                    <img src="blue_vial.png" alt="Best Seller Vial" class="vial-img">
                </div>
                <span class="arrow">›</span>
            </a>
        </div>

        <div class="product-cards">
            <a href="#" class="product-card bg-blue">
                <img src="blue_vial.png" alt="Retatrutide" class="product-img">
                <div class="product-label">
                    <div class="label-logo">peptim</div>
                    <div class="label-weight">10 MG</div>
                    <div class="label-name">Retatrutide</div>
                </div>
            </a>
            
            <a href="#" class="product-card bg-lightblue">
                <img src="blue_vial.png" alt="BPC-157" class="product-img">
                <div class="product-label">
                    <div class="label-logo">peptim</div>
                    <div class="label-weight">10 MG</div>
                    <div class="label-name">BPC-157</div>
                </div>
            </a>
            
            <a href="#" class="product-card bg-blue">
                <img src="blue_vial.png" alt="GHK-Cu" class="product-img">
                <div class="product-label">
                    <div class="label-logo">peptim</div>
                    <div class="label-weight">50 MG</div>
                    <div class="label-name">GHK-Cu</div>
                </div>
            </a>
            
            <a href="#" class="product-card bg-gray">
                <img src="gray_vial.png" alt="Tirzepatide" class="product-img">
                <div class="product-label gray-label">
                    <div class="label-logo">peptim</div>
                    <div class="label-weight">20 MG</div>
                    <div class="label-name">Tirzepatide</div>
                </div>
            </a>
            
            <a href="#" class="product-card bg-lightblue">
                <img src="blue_vial.png" alt="Semaglutide" class="product-img">
                <div class="product-label">
                    <div class="label-logo">peptim</div>
                    <div class="label-weight">5 MG</div>
                    <div class="label-name">Semaglutide</div>
                </div>
            </a>
        </div>
    </main>

    <button class="chat-btn" aria-label="Chat">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
        </svg>
    </button>
</body>
</html>
